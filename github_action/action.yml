name: 'PR Genius'
description: 'Evidence-backed PR contribution advisor — pre-submission checks, risk assessment, and optimization suggestions'
author: 'zsxh1990'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  command:
    description: 'PR Genius command to run (analyze, coach, triage, maintainer)'
    required: false
    default: 'coach'
  title:
    description: 'PR title'
    required: true
  repo:
    description: 'Target repo (org/name)'
    required: true
  body:
    description: 'PR body/description'
    required: false
    default: ''
  description:
    description: 'PR description (alternative to body)'
    required: false
    default: ''
  format:
    description: 'Output format (text, json)'
    required: false
    default: 'text'
  diff_stat:
    description: 'Diff statistics (e.g., "+100 -50")'
    required: false
    default: ''
  author:
    description: 'PR author username'
    required: false
    default: ''
  star_count:
    description: 'Repository star count'
    required: false
    default: '0'
  repo_merge_rate:
    description: 'Repository merge rate (0.0-1.0)'
    required: false
    default: '0.0'

outputs:
  result:
    description: 'Full analysis result (JSON or text)'
    value: ${{ steps.genius.outputs.result }}
  tier:
    description: 'Risk tier (low_risk, medium_risk, high_risk)'
    value: ${{ steps.genius.outputs.tier }}
  exit_code:
    description: 'Exit code (0 = pass, 1 = fail, 2 = error)'
    value: ${{ steps.genius.outputs.exit_code }}

runs:
  using: 'docker'
  image: 'Dockerfile.github_action'
  entrypoint: '/entrypoint.sh'
  env:
    GITHUB_TOKEN: ${{ github.token }}
  args:
    - ${{ inputs.command }}
    - ${{ inputs.title }}
    - '--repo'
    - ${{ inputs.repo }}
    - '--format'
    - ${{ inputs.format }}
